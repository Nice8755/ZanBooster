name: Publish

# Phone-friendly release button (GitHub app > Actions > Publish > Run workflow).
# test     = build and check only, nothing is published
# owner    = build the version from rebuild-4x, offer it to the owner's PC only
# premium  = offer the SAME exe the owner has to Premium customers
# everyone = release the SAME exe to all customers (asks for confirm = YES)
#
# Cloud sessions publish by pushing publish-request.json on their own claude/* branch
# (only after the owner typed the order in chat): {"stage","version","notes","confirm","at"}
on:
  push:
    branches: ["claude/**"]
    paths: ["publish-request.json"]
  workflow_dispatch:
    inputs:
      stage:
        description: "test / owner / premium / everyone"
        type: choice
        options: [test, owner, premium, everyone]
        default: test
      version:
        description: "owner/test: new version, e.g. 4.11.30. premium/everyone: the version you tested"
        required: true
      notes:
        description: "What changed (customers read this)"
        default: ""
      confirm:
        description: "everyone: type YES"
        default: ""

permissions:
  contents: write
  actions: write

concurrency: publish

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}

      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'push' && github.sha || 'rebuild-4x' }}", path: src, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { ref: rings, path: rings }
      - uses: actions/checkout@v4
        with: { ref: main, path: main }

      - name: Read the order
        id: q
        env:
          I_STAGE: ${{ inputs.stage }}
          I_VERSION: ${{ inputs.version }}
          I_NOTES: ${{ inputs.notes }}
          I_CONFIRM: ${{ inputs.confirm }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $o = Get-Content src/publish-request.json -Raw | ConvertFrom-Json
            $at = if ($o.at -is [datetime]) { $o.at.ToUniversalTime() } else { [datetime]::Parse($o.at, [Globalization.CultureInfo]::InvariantCulture, 'AdjustToUniversal,AssumeUniversal') }
            $age = ([datetime]::UtcNow - $at).TotalMinutes
            if ($age -gt 30 -or $age -lt -5) { throw "order is $([math]::Round($age)) minutes old, ask the owner again" }
            $s = "$($o.stage)"; $v = "$($o.version)"; $n = "$($o.notes)"; $c = "$($o.confirm)"
            [IO.File]::WriteAllText("$env:RUNNER_TEMP/discord.txt", "$($o.discord)", [Text.UTF8Encoding]::new($false))
          } else { $s = $env:I_STAGE; $v = $env:I_VERSION; $n = $env:I_NOTES; $c = $env:I_CONFIRM }
          if ($s -notin 'test', 'owner', 'premium', 'everyone') { throw "bad stage" }
          $n = ($n -replace '[\r\n]+', ' ').Trim(); if ($n.Length -gt 500) { $n = $n.Substring(0, 500) }
          $c = $c -replace '[^A-Za-z]', ''; if ($v -notmatch '^\d\.\d\d\.\d\d$') { throw 'version must look like 4.11.30' }
          "stage=$s" >> $env:GITHUB_OUTPUT
          "STAGE=$s" >> $env:GITHUB_ENV; "VERSION=$v" >> $env:GITHUB_ENV; "NOTES=$n" >> $env:GITHUB_ENV; "CONFIRM=$c" >> $env:GITHUB_ENV

      - name: Check inputs
        run: |
          if ($env:VERSION -notmatch '^\d\.\d\d\.\d\d$') { throw "version must look like 4.11.30" }
          if ($env:STAGE -eq 'everyone' -and $env:CONFIRM -cne 'YES') { throw 'everyone needs confirm = YES' }
          $r = Get-Content rings/rings.json -Raw | ConvertFrom-Json
          $cur = [version]$r.owner.version; $new = [version]$env:VERSION
          if ($env:STAGE -eq 'owner' -and $new -le $cur) { throw "owner already has $cur, use a higher version" }
          if ($env:STAGE -in 'premium', 'everyone' -and $new -ne $cur) { throw "owner ring is $cur, not $new. Publish stage owner first and test it" }
          if ($env:STAGE -eq 'everyone') {
            $l = [version](Get-Content main/latest.json -Raw | ConvertFrom-Json).version
            if ($new -le $l) { throw "customers already have $l" }
          }

      - uses: actions/setup-go@v5
        if: steps.q.outputs.stage == 'test' || steps.q.outputs.stage == 'owner'
        with: { go-version: "1.24", cache: false }
      - name: Build and check
        if: steps.q.outputs.stage == 'test' || steps.q.outputs.stage == 'owner'
        shell: powershell
        working-directory: src
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/ci-check.ps1
          ./tools/build-release.ps1 -Version $env:VERSION -Out "$env:RUNNER_TEMP\ZanBooster.exe"
          $v = (Get-Item "$env:RUNNER_TEMP\ZanBooster.exe").VersionInfo.FileVersion
          if ($v -ne "$env:VERSION.0") { throw "exe version is $v" }
          $u = [IO.File]::ReadAllText("$PWD\recovered\ui.html")
          if ($env:STAGE -eq 'owner' -and -not $u.Contains("id=`"changelog`">[{`"v`": `"$env:VERSION`"")) { throw "changelog has no entry for $env:VERSION on top" }

      # test / owner: send the new exe to VirusTotal (secret VT_API_KEY) and print which scanners flag it
      - name: VirusTotal
        if: steps.q.outputs.stage == 'test' || steps.q.outputs.stage == 'owner'
        continue-on-error: true
        env:
          VT: ${{ secrets.VT_API_KEY }}
        run: |
          if (-not $env:VT) { 'VT_API_KEY secret is not set, no scan'; exit 0 }
          $f = "$env:RUNNER_TEMP\ZanBooster.exe"; if (-not (Test-Path $f)) { 'no exe to scan'; exit 0 }
          $r = curl.exe -s -H "x-apikey: $env:VT" -F "file=@$f" https://www.virustotal.com/api/v3/files | ConvertFrom-Json
          $id = $r.data.id; if (-not $id) { "upload failed: $($r | ConvertTo-Json -Compress)"; exit 0 }
          for ($i = 0; $i -lt 40; $i++) { Start-Sleep 20; $a = curl.exe -s -H "x-apikey: $env:VT" "https://www.virustotal.com/api/v3/analyses/$id" | ConvertFrom-Json; if ($a.data.attributes.status -eq 'completed') { break } }
          $st = $a.data.attributes.stats
          "VT result: malicious=$($st.malicious) suspicious=$($st.suspicious) undetected=$($st.undetected) sha256=$($a.meta.file_info.sha256)"
          $a.data.attributes.results.PSObject.Properties | Where-Object { $_.Value.category -in 'malicious', 'suspicious' } | ForEach-Object { "VT flag: $($_.Name) = $($_.Value.result)" }

      - name: VT bisect (test only)
        if: steps.q.outputs.stage == 'test'
        continue-on-error: true
        shell: powershell
        working-directory: src
        env:
          VT: ${{ secrets.VT_API_KEY }}
        run: |
          New-Item -ItemType Directory -Force vtw | Out-Null
          $src = [IO.File]::ReadAllText("$PWD\recovered\engine.ps1"); $u = [Text.UTF8Encoding]::new($true); $L = $src -split "`n"
          $cut = { param($a, $b) $i = $src.IndexOf($a); $j = $src.IndexOf($b); $src.Remove($i, $j - $i) }
          $noSH = ($L | ForEach-Object { if ($_ -match "^\s+Start-Process powershell.exe -WindowStyle Hidden") { '    $null' } else { $_ } }) -join "`n"
          $noAT = ($L | ForEach-Object { if ($_ -match "Register-ScheduledTask -TaskName") { '            $null' } else { $_ } }) -join "`n"
          [IO.File]::WriteAllText("$PWD\vtw\x1-noStartHelper.ps1", $noSH, $u)
          [IO.File]::WriteAllText("$PWD\vtw\x2-noAffTask.ps1", $noAT, $u)
          [IO.File]::WriteAllText("$PWD\vtw\x3-noBoth.ps1", (($noSH -split "`n") | ForEach-Object { if ($_ -match "Register-ScheduledTask -TaskName") { '            $null' } else { $_ } }) -join "`n", $u)
          [IO.File]::WriteAllText("$PWD\vtw\x4-noRpc.ps1", (& $cut 'function Do-Rpc' 'function Start-Helper'), $u)
          [IO.File]::WriteAllText("$PWD\vtw\x5-noTray.ps1", (& $cut 'function Do-Tray' 'function Do-Rpc'), $u)
          [IO.File]::WriteAllText("$PWD\vtw\x6-noDup.ps1", (& $cut 'function Do-Dup' 'function Do-Tray'), $u)
          ./tools/vt-scan.ps1 -Files (Get-ChildItem vtw | Sort-Object Name | ForEach-Object FullName)

      - name: Keep the cloud work on rebuild-4x
        if: steps.q.outputs.stage == 'owner' && github.event_name == 'push'
        run: |
          git -C src push origin "HEAD:rebuild-4x"
          if ($LASTEXITCODE) { throw 'rebuild-4x moved on (work was done on the PC). Merge origin/rebuild-4x first, then order again' }

      - name: Owner ring
        if: steps.q.outputs.stage == 'owner'
        run: |
          git config --global user.name "Nice8755"; git config --global user.email "Nice8755@users.noreply.github.com"
          Copy-Item "$env:RUNNER_TEMP/ZanBooster.exe" rings/ZanBooster.exe -Force
          $sha = (Get-FileHash rings/ZanBooster.exe).Hash.ToLower()
          git -C rings add ZanBooster.exe; git -C rings commit -m "owner build $env:VERSION"; git -C rings push; if ($LASTEXITCODE) { throw 'push' }
          $c = (git -C rings rev-parse HEAD).Trim()
          $r = Get-Content rings/rings.json -Raw | ConvertFrom-Json
          $o = [ordered]@{ machines = @($r.owner.machines); version = $env:VERSION; sha256 = $sha; url = "https://raw.githubusercontent.com/$env:REPO/$c/ZanBooster.exe"; notes = $env:NOTES }
          [IO.File]::WriteAllText("$PWD/rings/rings.json", ([ordered]@{ owner = $o; vip = $r.vip } | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
          git -C rings add rings.json; git -C rings commit -m "rings: owner $env:VERSION"; git -C rings push; if ($LASTEXITCODE) { throw 'push' }

      - name: Fetch the exact exe the owner tested
        if: steps.q.outputs.stage == 'premium' || steps.q.outputs.stage == 'everyone'
        run: |
          $o = (Get-Content rings/rings.json -Raw | ConvertFrom-Json).owner
          Invoke-WebRequest $o.url -OutFile "$env:RUNNER_TEMP/ZanBooster.exe"
          if ((Get-FileHash "$env:RUNNER_TEMP/ZanBooster.exe").Hash.ToLower() -ne $o.sha256) { throw 'sha mismatch' }

      - name: Premium ring
        if: steps.q.outputs.stage == 'premium' || steps.q.outputs.stage == 'everyone'
        run: |
          git config --global user.name "Nice8755"; git config --global user.email "Nice8755@users.noreply.github.com"
          $r = Get-Content rings/rings.json -Raw | ConvertFrom-Json
          $n = if ($env:NOTES) { $env:NOTES } else { $r.owner.notes }
          $r.vip = [pscustomobject][ordered]@{ version = $r.owner.version; sha256 = $r.owner.sha256; url = $r.owner.url; notes = $n }
          [IO.File]::WriteAllText("$PWD/rings/rings.json", ($r | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
          git -C rings add rings.json
          git -C rings diff --cached --quiet
          if ($LASTEXITCODE) { git -C rings commit -m "rings: vip $env:VERSION"; git -C rings push; if ($LASTEXITCODE) { throw 'push' } }
          exit 0

      - name: Everyone
        if: steps.q.outputs.stage == 'everyone'
        run: |
          $o = (Get-Content rings/rings.json -Raw | ConvertFrom-Json).owner
          $n = if ($env:NOTES) { $env:NOTES } else { $o.notes }
          foreach ($c in 'release', 'beta') {
            Copy-Item "$env:RUNNER_TEMP/ZanBooster.exe" "main/$c/ZanBooster.exe" -Force
            $f = if ($c -eq 'release') { 'latest.json' } else { 'beta.json' }
            [IO.File]::WriteAllText("$PWD/main/$f", ([ordered]@{ version = $o.version; sha256 = $o.sha256; file = "$c/ZanBooster.exe"; notes = $n } | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
          }
          git -C main add -A; git -C main commit -m "v${env:VERSION}: release to everyone (binary release)"; git -C main push; if ($LASTEXITCODE) { throw 'push' }
          gh workflow run release.yml --repo $env:REPO --ref main

      # premium / everyone: announce in Discord through the DISCORD_WEBHOOK repository secret (never put the link in the repo)
      # text = "discord" from publish-request.json, else a short line made from the notes. No @everyone pings.
      - name: Discord
        if: steps.q.outputs.stage == 'premium' || steps.q.outputs.stage == 'everyone'
        continue-on-error: true
        env:
          DC_HOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if (-not $env:DC_HOOK) { 'DISCORD_WEBHOOK secret is not set, nothing posted'; exit 0 }
          $f = "$env:RUNNER_TEMP/discord.txt"; $t = if (Test-Path $f) { [IO.File]::ReadAllText($f).Trim() } else { '' }
          if (-not $t) { $who = if ($env:STAGE -eq 'everyone') { 'everyone' } else { 'Premium' }; $t = "**Zan Booster $env:VERSION** ($who)`n$env:NOTES" }
          # posted as a card (embed): coloured bar on the side, so each announcement stands apart from the last one
          $title = "Zan Booster $env:VERSION"; $ls = $t -split "`n"
          if ($ls[0] -match '^#+\s*(.+)$') { $title = $Matches[1].Trim(); $t = ($ls | Select-Object -Skip 1) -join "`n" }
          $t = $t.Trim(); if ($t.Length -gt 3900) { $t = $t.Substring(0, 3900) }; if ($title.Length -gt 250) { $title = $title.Substring(0, 250) }
          $col = if ($env:STAGE -eq 'everyone') { 0x22D3FF } else { 0xFFC94D }
          $who = if ($env:STAGE -eq 'everyone') { 'อัปเดตสำหรับทุกคน' } else { 'อัปเดตสำหรับ Premium' }
          $e = @{ title = $title; description = $t; color = $col; footer = @{ text = "Zan Booster v$env:VERSION · $who" }; timestamp = (Get-Date).ToUniversalTime().ToString('o') }
          $b = @{ allowed_mentions = @{ parse = @() }; embeds = @($e) } | ConvertTo-Json -Depth 6
          Invoke-RestMethod -Uri $env:DC_HOOK -Method Post -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($b)) | Out-Null
          'posted to Discord'

      - name: Result
        run: |
          $r = Get-Content rings/rings.json -Raw | ConvertFrom-Json
          $l = (Get-Content main/latest.json -Raw | ConvertFrom-Json).version
          "### ${env:STAGE} ${env:VERSION}`n- owner: $($r.owner.version)`n- premium: $($r.vip.version)`n- everyone: $l" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8
